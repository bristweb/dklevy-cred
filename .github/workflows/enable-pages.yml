# One-shot: the cloud agent token cannot create a Pages site. The Actions
# GITHUB_TOKEN on this repo has pages:write, which the REST API accepts.
name: Enable GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  pages: write
  contents: read
jobs:
  enable:
    runs-on: ubuntu-latest
    steps:
      - name: Create Pages site from main /
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          repo="${{ github.repository }}"
          hdr=(-H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28")
          code=$(curl -sS -o /tmp/pages.json -w "%{http_code}" "${hdr[@]}" "https://api.github.com/repos/${repo}/pages")
          echo "GET /pages -> $code"
          cat /tmp/pages.json
          echo
          if [ "$code" = "200" ]; then
            echo "Pages site already exists"
            exit 0
          fi
          if [ "$code" != "404" ]; then
            echo "Unexpected GET status $code"
            exit 1
          fi
          curl -sS -f -X POST "${hdr[@]}" "https://api.github.com/repos/${repo}/pages" \
            -d '{"build_type":"legacy","source":{"branch":"main","path":"/"}}'
          echo
          echo "Pages site created"
